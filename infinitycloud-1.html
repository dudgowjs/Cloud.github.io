    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, updateDoc, doc, onSnapshot, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        // Firebase 프로젝트 설정
        const firebaseConfig = {
            apiKey: "AIzaSyAjvFc7BZ5sfY6P-Hy-rH_rNvx_TCmGpyw",
            authDomain: "glogin-e1451.firebaseapp.com",
            projectId: "glogin-e1451",
            storageBucket: "glogin-e1451.firebasestorage.app",
            messagingSenderId: "786508231265",
            appId: "1:786508231265:web:82f2d31b75790f608af020"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const googleProvider = new GoogleAuthProvider();

        let files = [];
        let unsubscribeFiles = null;
        let aceEditor = null;
        let currentEditingId = null;
        let fileToDelete = null;
        let confirmModalInstance = null;
        let fileViewerModalInstance = null;
        let accountModalInstance = null;
        let errorModalInstance = null;
        let currentUser = null;

        function showLoading(text = "처리 중입니다...") {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) {
                document.getElementById('loadingText').innerText = text;
                overlay.style.display = 'flex';
            }
        }

        function hideLoading() {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) {
                overlay.style.display = 'none';
            }
        }

        function showErrorModal(title, message) {
            document.getElementById('errorModalTitle').innerText = title;
            document.getElementById('errorModalMessage').innerText = message;
            if (errorModalInstance) {
                errorModalInstance.show();
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.gallery-card')) {
                    document.querySelectorAll('.gallery-card.show-overlay').forEach(c => c.classList.remove('show-overlay'));
                }
            });

            confirmModalInstance = new bootstrap.Modal(document.getElementById('confirmModal'));
            fileViewerModalInstance = new bootstrap.Modal(document.getElementById('fileViewerModal'));
            accountModalInstance = new bootstrap.Modal(document.getElementById('accountModal'));
            errorModalInstance = new bootstrap.Modal(document.getElementById('errorModal'));

            if (window.ace) {
                aceEditor = ace.edit("aceEditorContainer");
                aceEditor.setTheme("ace/theme/twilight");
                aceEditor.getSession().setMode("ace/mode/javascript");
                aceEditor.setOptions({
                    fontSize: "14pt",
                    showPrintMargin: false,
                    highlightActiveLine: true
                });
            }

            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    renderFiles(e.target.value.trim().toLowerCase());
                });
            }

            // Event Listeners
            document.getElementById('googleLoginBtn')?.addEventListener('click', handleGoogleLogin);
            document.getElementById('fileInput')?.addEventListener('change', handleFileSelect);
            document.getElementById('saveFileBtn')?.addEventListener('click', saveCodeContent);
            document.getElementById('modalLogoutBtn')?.addEventListener('click', handleLogout);
        });

        // Firebase Auth 상태 감지
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            updateUserUI(user);

            if (user) {
                subscribeToUserFiles(user.uid);
            } else {
                if (unsubscribeFiles) {
                    unsubscribeFiles();
                    unsubscribeFiles = null;
                }
                files = [];
                renderFiles();
            }
        });

        function updateUserUI(user) {
            const loggedInControls = document.getElementById('loggedInControls');
            const profileDropdownBtn = document.getElementById('profileDropdownBtn');
            const profileDropdownMenu = document.getElementById('profileDropdownMenu');
            const fileCountBadge = document.getElementById('fileCountBadge');
            const loggedInView = document.getElementById('loggedInView');
            const loggedOutView = document.getElementById('loggedOutView');

            if (user) {
                if (profileDropdownBtn) {
                    profileDropdownBtn.innerHTML = `<img src="${user.photoURL || 'https://via.placeholder.com/38'}" width="38" height="38" class="rounded-circle" alt="프로필">`;
                }

                if (profileDropdownMenu) {
                    profileDropdownMenu.innerHTML = `
                        <li class="px-3 py-2 border-bottom mb-1">
                            <div class="fw-bold text-truncate">${user.displayName || '사용자'}</div>
                            <div class="text-muted small text-truncate">${user.email || ''}</div>
                        </li>
                        <li>
                            <button class="dropdown-item rounded-3 py-2 d-flex align-items-center gap-2" id="accountMenuBtn">
                                <i class="bi bi-person-gear text-secondary fs-5"></i>
                                <span>계정 정보 관리</span>
                            </button>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <button class="dropdown-item rounded-3 py-2 d-flex align-items-center gap-2 text-danger" id="logoutMenuBtn">
                                <i class="bi bi-box-arrow-right fs-5"></i>
                                <span>로그아웃</span>
                            </button>
                        </li>
                    `;
                    document.getElementById('accountMenuBtn')?.addEventListener('click', openAccountModal);
                    document.getElementById('logoutMenuBtn')?.addEventListener('click', handleLogout);
                }

                if (loggedInControls) loggedInControls.style.setProperty('display', 'flex', 'important');
                if (fileCountBadge) fileCountBadge.style.setProperty('display', 'inline-block', 'important');
                if (loggedInView) loggedInView.style.display = 'block';
                if (loggedOutView) loggedOutView.style.display = 'none';
            } else {
                if (loggedInControls) loggedInControls.style.setProperty('display', 'none', 'important');
                if (fileCountBadge) fileCountBadge.style.setProperty('display', 'none', 'important');
                if (loggedInView) loggedInView.style.display = 'none';
                if (loggedOutView) loggedOutView.style.display = 'flex';
            }
        }

        function subscribeToUserFiles(uid) {
            showLoading("파일 실시간 동기화 중...");
            const q = query(collection(db, "cloud_files"), where("uid", "==", uid));
            unsubscribeFiles = onSnapshot(q, (snapshot) => {
                files = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                renderFiles(document.getElementById('searchInput')?.value.trim().toLowerCase() || '');
                hideLoading();
            }, (error) => {
                console.error("실시간 파일 동기화 오류:", error);
                hideLoading();
                showErrorModal("동기화 오류", "파일을 불러오는 중 오류가 발생했습니다: " + error.message);
            });
        }

        function openAccountModal() {
            if (!currentUser) return;
            document.getElementById('modalUserPhoto').src = currentUser.photoURL || '';
            document.getElementById('modalUserName').innerText = currentUser.displayName || '사용자';
            document.getElementById('modalUserEmail').innerText = currentUser.email || '';
            accountModalInstance.show();
        }

        async function handleGoogleLogin() {
            showLoading("구글 로그인 진행 중...");
            try {
                await signInWithPopup(auth, googleProvider);
            } catch (error) {
                console.error("구글 로그인 실패:", error);
                let friendlyMsg = error.message;
                if (error.code === 'auth/popup-closed-by-user') {
                    friendlyMsg = '로그인 팝업 창이 닫혔습니다. 다시 시도해 주세요.';
                } else if (error.code === 'auth/unauthorized-domain') {
                    friendlyMsg = '현재 도메인이 Firebase Auth 승인된 도메인(Authorized domain)에 등록되어 있지 않습니다.';
                } else if (error.code === 'auth/popup-blocked') {
                    friendlyMsg = '브라우저 팝업이 차단되었습니다. 팝업 차단을 해제한 후 다시 시도해 주세요.';
                }
                showErrorModal("로그인 실패", friendlyMsg);
            } finally {
                hideLoading();
            }
        }

        async function handleLogout() {
            if (accountModalInstance) accountModalInstance.hide();
            showLoading("로그아웃 중...");
            try {
                await signOut(auth);
            } catch (error) {
                console.error("로그아웃 실패:", error);
                showErrorModal("로그아웃 오류", "로그아웃 중 오류가 발생했습니다: " + error.message);
            } finally {
                hideLoading();
            }
        }

        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function renderFiles(keyword = '') {
            const container = document.getElementById('fileListContainer');
            if (!container) return;
            
            container.innerHTML = '';
            let list = files.filter(file => file.name && file.name.toLowerCase().includes(keyword));
            
            const countBadge = document.getElementById('fileCountBadge');
            if (countBadge) countBadge.innerText = files.length;

            list.sort((a, b) => {
                if (a.starred !== b.starred) return b.starred ? 1 : -1;
                return (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0);
            });

            if (list.length === 0) {
                container.innerHTML = `
                    <div class="grid-column-full w-100 py-4 text-center" style="grid-column: 1 / -1;">
                        <p class="empty-file-text mb-0">저장된 파일이 없습니다.</p>
                    </div>
                `;
                return;
            }

            list.forEach(file => {
                const ext = file.name.split('.').pop().toLowerCase();
                const isImage = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'].includes(ext);
                const isCode = ['js', 'html', 'css', 'json', 'txt', 'py', 'md', 'csv'].includes(ext) || file.type === 'code';

                const itemWrapper = document.createElement('div');
                itemWrapper.className = 'gallery-item';

                const card = document.createElement('div');
                card.className = 'gallery-card';

                let contentHtml = '';
                if (isImage) {
                    contentHtml = `<img src="${file.downloadURL}" alt="${escapeHtml(file.name)}" loading="lazy">`;
                } else if (isCode) {
                    const textSnippet = (file.snippet || '').substring(0, 150);
                    contentHtml = `<div class="code-preview">${escapeHtml(textSnippet)}</div>`;
                } else {
                    contentHtml = `
                        <div class="icon-preview">
                            <i class="bi bi-file-earmark-text display-5 text-primary"></i>
                        </div>
                    `;
                }

                card.innerHTML = `
                    ${contentHtml}
                    <div class="card-overlay">
                        <div class="d-flex justify-content-end align-items-center w-100">
                            <button type="button" class="btn btn-sm text-warning p-0 shadow-none btn-star" title="즐겨찾기">
                                <i class="bi ${file.starred ? 'bi-star-fill' : 'bi-star'} fs-5"></i>
                            </button>
                        </div>
                        <div class="w-100 d-flex justify-content-center align-items-center gap-2 mb-2">
                            <button type="button" class="btn btn-light rounded-circle p-0 d-flex align-items-center justify-content-center shadow-sm btn-view" style="width: 36px; height: 36px;" title="보기">
                                <i class="bi bi-eye-fill fs-6 text-dark"></i>
                            </button>
                            <button type="button" class="btn btn-danger rounded-circle p-0 d-flex align-items-center justify-content-center shadow-sm btn-delete" style="width: 36px; height: 36px;" title="삭제">
                                <i class="bi bi-trash-fill fs-6 text-white"></i>
                            </button>
                        </div>
                    </div>
                `;

                card.querySelector('.btn-star').addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleStar(file.id, file.starred);
                });
                card.querySelector('.btn-view').addEventListener('click', (e) => {
                    e.stopPropagation();
                    openFileViewer(file.id);
                });
                card.querySelector('.btn-delete').addEventListener('click', (e) => {
                    e.stopPropagation();
                    promptDelete(file);
                });

                card.addEventListener('click', () => {
                    openFileViewer(file.id);
                });

                const nameLabel = document.createElement('div');
                nameLabel.className = 'file-name';
                nameLabel.innerText = file.name;
                nameLabel.title = file.name;

                itemWrapper.appendChild(card);
                itemWrapper.appendChild(nameLabel);
                container.appendChild(itemWrapper);
            });
        }

        async function handleFileSelect(e) {
            if (!currentUser) {
                alert("로그인이 필요합니다.");
                e.target.value = '';
                return;
            }

            const selectedFiles = Array.from(e.target.files || []);
            if (!selectedFiles.length) return;

            showLoading("파일을 클라우드에 업로드 중입니다...");

            try {
                for (const f of selectedFiles) {
                    const ext = f.name.split('.').pop().toLowerCase();
                    const isCode = ['js', 'html', 'css', 'json', 'txt', 'py', 'md', 'csv'].includes(ext);

                    let snippet = '';
                    if (isCode) {
                        try {
                            snippet = await f.text();
                        } catch (textErr) {
                            console.warn("텍스트 추출 실패:", textErr);
                        }
                    }

                    const storagePath = `users/${currentUser.uid}/files/${Date.now()}_${f.name}`;
                    const storageRef = ref(storage, storagePath);

                    let downloadURL = "";
                    try {
                        const uploadTask = await uploadBytesResumable(storageRef, f);
                        downloadURL = await getDownloadURL(uploadTask.ref);
                    } catch (storageError) {
                        console.warn("Storage 업로드 건너뜀, Firestore 동기화만 수행:", storageError);
                    }

                    await addDoc(collection(db, "cloud_files"), {
                        uid: currentUser.uid,
                        name: f.name,
                        type: isCode ? 'code' : 'media',
                        size: formatBytes(f.size),
                        starred: false,
                        downloadURL: downloadURL,
                        storagePath: downloadURL ? storagePath : "",
                        snippet: snippet,
                        createdAt: serverTimestamp()
                    });
                }
            } catch (err) {
                console.error("업로드 에러:", err);
                alert("업로드 중 오류가 발생했습니다: " + err.message);
            } finally {
                hideLoading();
                e.target.value = '';
            }
        }

        function openFileViewer(id) {
            const file = files.find(f => f.id === id);
            if (!file) return;

            currentEditingId = id;
            document.getElementById('modalFileName').innerText = file.name;

            const codeWrapper = document.getElementById('codeEditorWrapper');
            const iframeWrapper = document.getElementById('iframeViewerWrapper');
            const iframe = document.getElementById('fileIframe');
            const saveBtn = document.getElementById('saveFileBtn');

            const ext = file.name.split('.').pop().toLowerCase();
            const isCode = ['js', 'html', 'css', 'json', 'txt', 'py', 'md', 'csv'].includes(ext) || file.type === 'code';

            if (isCode) {
                codeWrapper.style.display = 'block';
                iframeWrapper.style.display = 'none';
                saveBtn.style.display = 'inline-block';

                let content = file.snippet || '';
                if (aceEditor) {
                    let mode = "ace/mode/text";
                    if (ext === 'js') mode = "ace/mode/javascript";
                    else if (ext === 'html') mode = "ace/mode/html";
                    else if (ext === 'css') mode = "ace/mode/css";
                    else if (ext === 'json') mode = "ace/mode/json";
                    else if (ext === 'py') mode = "ace/mode/python";
                    else if (ext === 'md') mode = "ace/mode/markdown";

                    aceEditor.getSession().setMode(mode);
                    aceEditor.setValue(content, -1);
                }
            } else {
                codeWrapper.style.display = 'none';
                iframeWrapper.style.display = 'flex';
                saveBtn.style.display = 'none';
                iframe.src = file.downloadURL || '';
            }

            fileViewerModalInstance.show();
            if (isCode && aceEditor) {
                setTimeout(() => aceEditor.resize(), 300);
            }
        }

        async function saveCodeContent() {
            if (!currentEditingId || !aceEditor) return;

            const newContent = aceEditor.getValue();
            showLoading("클라우드 저장 중...");

            try {
                const docRef = doc(db, "cloud_files", currentEditingId);
                await updateDoc(docRef, {
                    snippet: newContent,
                    size: formatBytes(new Blob([newContent]).size),
                    updatedAt: serverTimestamp()
                });

                fileViewerModalInstance.hide();
            } catch (err) {
                console.error("저장 실패:", err);
                alert("저장 중 오류가 발생했습니다: " + err.message);
            } finally {
                hideLoading();
            }
        }

        async function toggleStar(id, currentStarred) {
            try {
                const docRef = doc(db, "cloud_files", id);
                await updateDoc(docRef, {
                    starred: !currentStarred
                });
            } catch (err) {
                console.error("즐겨찾기 변경 실패:", err);
            }
        }

        function promptDelete(file) {
            fileToDelete = file;
            document.getElementById('confirmMessage').innerText = `'${file.name}' 파일을 클라우드 드라이브에서 영구 삭제하시겠습니까?`;
            confirmModalInstance.show();
        }

        document.getElementById('confirmDeleteBtn')?.addEventListener('click', async () => {
            if (!fileToDelete) return;

            showLoading("파일 삭제 중...");
            try {
                if (fileToDelete.storagePath) {
                    try {
                        const fileRef = ref(storage, fileToDelete.storagePath);
                        await deleteObject(fileRef);
                    } catch (stErr) {
                        console.warn("Storage 삭제 에러 (무시 후 계속):", stErr);
                    }
                }

                await deleteDoc(doc(db, "cloud_files", fileToDelete.id));

                confirmModalInstance.hide();
                fileToDelete = null;
            } catch (err) {
                console.error("삭제 실패:", err);
                alert("파일 삭제 실패: " + err.message);
            } finally {
                hideLoading();
            }
        });
    </script>
</body>
</html>
